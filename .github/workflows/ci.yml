name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  release:
    types: [published]

env:
  NXF_ANSI_LOG: false
  NXF_VER: "25.10.0"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v1
        with:
          version: "${{ env.NXF_VER }}"

      - name: Check pipeline syntax
        run: |
          nextflow run main.nf -profile test_stub -stub-run --outdir ./results_lint

  test-scripts:
    name: Test Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Test FASTA validation
        run: |
          python3 bin/validate_fasta.py tests/data/genome.fa --output /tmp/fasta_test.json

      - name: Test GTF validation
        run: |
          python3 bin/validate_gtf.py tests/data/genes.gtf --output /tmp/gtf_test.json

      - name: Test samplesheet validation
        run: |
          python3 bin/validate_samplesheet.py tests/data/samplesheet.csv \
            --output /tmp/samplesheet_test.json \
            --output-csv /tmp/validated_samplesheet.csv

      - name: Test annotation metrics
        run: |
          python3 bin/annotation_metrics.py tests/data/genes.gtf \
            --fasta tests/data/genome.fa \
            --output /tmp/metrics_test.json

  test-stub:
    name: Stub Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v1
        with:
          version: "${{ env.NXF_VER }}"

      - name: Run stub test
        run: |
          nextflow run main.nf \
            -profile test_stub \
            -stub-run \
            --outdir ./results_stub

      - name: Verify outputs exist
        run: |
          test -f results_stub/validation/fasta_validation.json
          test -f results_stub/validation/gtf_validation.json
          test -f results_stub/report/report.html

  test-docker:
    name: Docker Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v1
        with:
          version: "${{ env.NXF_VER }}"

      - name: Run pipeline with Docker
        run: |
          nextflow run main.nf \
            -profile test,docker \
            --outdir ./results_docker

      - name: Verify outputs
        run: |
          test -f results_docker/validation/fasta_validation.json
          test -f results_docker/validation/gtf_validation.json
          test -f results_docker/annotation_metrics/annotation_metrics.json
          test -f results_docker/report/report.html
          test -f results_docker/report/report.md

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: Pipeline results
          path: results_docker/

  test-singularity:
    name: Singularity Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v1
        with:
          version: "${{ env.NXF_VER }}"

      - name: Set up Singularity
        uses: eWaterCycle/setup-singularity@v7
        with:
          singularity-version: 3.8.3

      - name: Run pipeline with Singularity
        run: |
          nextflow run main.nf \
            -profile test,singularity \
            --outdir ./results_singularity

      - name: Verify outputs
        run: |
          test -f results_singularity/validation/fasta_validation.json
          test -f results_singularity/report/report.html
